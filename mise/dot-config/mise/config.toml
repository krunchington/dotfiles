[bootstrap.packages]
# Linux
"pacman:jq" = "latest"

[tools]
# System tools
neovim = "0.12"
rg = "15.1.0"
yq = "4.53.3"
tree-sitter = "0.26.13"

# Language Baselines
go = { version = "1.27", postinstall = "mise run gopls"}
rust = { version = "1.98.0", profile = "default" }
node = { version = "26.8.0", postinstall = "mise run ts-lsp"}
python = "3.14"

[tasks.gopls]
description = "Install gopls"
run = "go install golang.org/x/tools/gopls@latest"

[tasks.ts-lsp]
description = "Install TS LSP"
run = "npm install -g typescript-language-server typescript@6"

